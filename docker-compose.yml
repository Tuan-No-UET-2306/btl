services:
  postgres:
    image: postgres:16
    container_name: lpr_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-khongmk}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - lpr_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: lpr_redis
    ports:
      - "6379:6379"
    volumes:
      - lpr_redis_data:/data
    command: redis-server --appendonly yes

  minio:
    image: minio/minio:latest
    container_name: lpr_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - lpr_minio_data:/data

volumes:
  lpr_postgres_data:
  lpr_minio_data:
  lpr_redis_data:

