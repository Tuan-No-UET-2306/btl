name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.10"
  NODE_VERSION: "20"
  VITE_API_BASE: ${{ vars.PUBLIC_API_BASE_URL || 'http://localhost:8000' }}

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      DATABASE_URL: sqlite:///./test_lpr.db
      JWT_SECRET_KEY: ci-secret
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "60"
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: uploaded-videos
      MINIO_PUBLIC_URL: http://localhost:9000
      MINIO_PUBLIC_READ: "true"
      MINIO_SECURE: "false"
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_BACKEND_URL: redis://localhost:6379/0
      REDIS_URL: redis://localhost:6379/0
      VIDEO_DETECT_MODEL_PATH: src/models/LP_detector_nano_61.onnx
      VIDEO_OCR_MODEL_PATH: src/models/LP_ocr_nano_62.onnx

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirement.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libgl1 libglib2.0-0 libgomp1

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.7.0+cpu \
            torchvision==0.22.0+cpu
          pip install -r requirement.txt

      - name: Run backend tests
        run: pytest src/backend/tests -q --ignore=src/backend/tests/test_video_ocr.py

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Build frontend
        working-directory: src/frontend
        run: npm run build

  docker-build-push:
    name: Build and push Docker images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-build
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image repository
        id: image
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/backend.Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.repo }}/backend:${{ github.sha }}
            ${{ steps.image.outputs.repo }}/backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/frontend.Dockerfile
          push: true
          build-args: |
            VITE_API_BASE=${{ env.VITE_API_BASE }}
          tags: |
            ${{ steps.image.outputs.repo }}/frontend:${{ github.sha }}
            ${{ steps.image.outputs.repo }}/frontend:latest
