# ---------------------------------------------------------------------------
# Prometheus configuration for LPR monitoring
# ---------------------------------------------------------------------------
global:
  scrape_interval:     15s      # How frequently to scrape targets
  evaluation_interval: 15s      # How frequently to evaluate rules
  scrape_timeout:      10s

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []  # No external alertmanager for academic project

# Load alert rules from the rules directory
rule_files:
  - "alert_rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Backend FastAPI application metrics
  - job_name: "lpr-backend"
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:8000"  # local development (Docker Desktop)
          - "backend:8000"               # docker-compose service name
    # Fallback: try both since only one will respond in a given setup
    # Prometheus will mark unreachable targets as DOWN but keep scraping
    # the reachable one.

  # Node exporter (optional – if you want host-level metrics)
  # - job_name: "node"
  #   static_configs:
  #     - targets: ["node-exporter:9100"]