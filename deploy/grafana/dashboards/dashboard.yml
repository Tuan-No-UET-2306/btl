# ---------------------------------------------------------------------------
# Grafana dashboard provisioning
# Tells Grafana to load the LPR dashboard JSON from this directory.
# ---------------------------------------------------------------------------
apiVersion: 1

providers:
  - name: "LPR System Dashboards"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/dashboards