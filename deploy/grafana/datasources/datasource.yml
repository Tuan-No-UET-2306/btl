# ---------------------------------------------------------------------------
# Grafana data source provisioning – Prometheus
# This file tells Grafana to auto-configure the Prometheus data source
# on startup, so the LPR dashboard works out of the box.
# ---------------------------------------------------------------------------
apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    version: 1
