services:
  redis:
    image: redis:7
    container_name: lpr_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - lpr_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: lpr_minio
    restart: unless-stopped
    ports:
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - lpr_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    image: ${BACKEND_IMAGE:-lpr-backend:local}
    container_name: lpr_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CORS_ORIGINS: ${DOCKER_CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_URL: ${DOCKER_MINIO_PUBLIC_URL:-http://localhost:8080/files}
      MINIO_PUBLIC_READ: ${MINIO_PUBLIC_READ:-true}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_BACKEND_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    image: ${BACKEND_IMAGE:-lpr-backend:local}
    container_name: lpr_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_URL: ${DOCKER_MINIO_PUBLIC_URL:-http://localhost:8080/files}
      MINIO_PUBLIC_READ: ${MINIO_PUBLIC_READ:-true}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_BACKEND_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
    command: celery -A src.backend.tasks.celery_app:celery_app worker --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      backend:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
      args:
        VITE_API_BASE: ${DOCKER_PUBLIC_APP_URL:-http://localhost:8080}
    image: ${FRONTEND_IMAGE:-lpr-frontend:local}
    container_name: lpr_frontend
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Monitoring – Prometheus (metrics store & alert evaluator)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: lpr_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - lpr_prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Monitoring – Grafana (visualisation)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.0.0
    container_name: lpr_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/lpr_dashboard.json
      GF_INSTALL_PLUGINS: ""
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/dashboards/lpr_dashboard.json:/etc/grafana/dashboards/lpr_dashboard.json:ro
      - lpr_grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Monitoring – backend port exposure so Prometheus can scrape from host
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: lpr_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      # Expose backend port so Prometheus can scrape if running outside Docker
    volumes:
      - ./deploy/nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - minio

volumes:
  lpr_redis_data:
  lpr_minio_data:
  lpr_backend_logs:
  lpr_prometheus_data:
  lpr_grafana_data:
